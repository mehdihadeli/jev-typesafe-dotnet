name: Build, test, and publish

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Jev.Typesafe.Sdk.slnx

      - name: Build
        run: dotnet build Jev.Typesafe.Sdk.slnx --configuration Release --no-restore

      - name: Test unit project
        run: dotnet test --project tests/unit-tests/Typesafe.Sdk.UnitTests.csproj --configuration Release --no-restore

      - name: Test integration project
        if: ${{ env.TYPESAFE_API_KEY != '' }}
        run: dotnet test --project tests/integration-tests/Typesafe.Sdk.IntegrationTests.csproj --configuration Release --no-restore

  calculate-version:
    name: Calculate release version
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      informational_version: ${{ steps.version.outputs.informational_version }}
      environment: ${{ steps.version.outputs.environment }}
      commit: ${{ steps.version.outputs.commit }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install NBGV CLI
        run: dotnet tool install --tool-path "$RUNNER_TEMP/nbgv" nbgv --version 3.10.94

      - name: Calculate version
        id: version
        shell: bash
        run: |
          NBGV="$RUNNER_TEMP/nbgv/nbgv" bash scripts/calculate-version.sh

  publish:
    name: Publish package and release assets
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && needs['calculate-version'].outputs.environment == 'dev')
    needs:
      - build-test
      - calculate-version
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Jev.Typesafe.Sdk.csproj

      - name: Pack
        run: dotnet pack src/Jev.Typesafe.Sdk.csproj --configuration Release --no-restore --output artifacts -p:PublicRelease=true -p:ReleasePackageVersion="${{ needs['calculate-version'].outputs.version }}" -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      - name: Publish to NuGet.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish matching Release Drafter draft
        if: always()
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          version: ${{ needs['calculate-version'].outputs.version }}
          name: v${{ needs['calculate-version'].outputs.version }}
          tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs['calculate-version'].outputs.version) }}
          publish: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(needs['calculate-version'].outputs.version, '-preview.') }}
          prerelease: ${{ contains(needs['calculate-version'].outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs['calculate-version'].outputs.version) }}" artifacts/*.nupkg artifacts/*.snupkg --clobber
